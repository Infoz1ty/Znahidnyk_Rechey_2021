[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-classical-cv"
version = "0.1.0"
description = "Класична система виявлення, класифікації та пошуку деталей LEGO (STEM-проєкт)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pylint>=3.2.0",
]
analysis = [
    "matplotlib>=3.8.0",
]
prep = [
    "rawpy>=0.21.0",
]

[project.scripts]
lego-cv = "lego_cv.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.pylint.main]
source-roots = ["src"]
py-version = "3.10"
fail-under = 10.0

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-attributes = 12
max-locals = 20

[tool.pylint.messages_control]
disable = [
    "fixme",
]
